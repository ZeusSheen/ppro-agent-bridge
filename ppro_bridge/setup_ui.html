<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Premiere Agent Bridge Setup</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2320232b'/%3E%3Cg transform='translate(4 3)' fill='none' stroke='%238B7CFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 17h20'/%3E%3Cpath d='M4 17c1.5-5 4.5-8 8-8s6.5 3 8 8'/%3E%3Cpath d='M8 17v-6.3M12 17V9M16 17v-6.3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei UI", sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);

  /* Dark is the default theme; [data-theme="light"] below is the alternative. */
  --page: #16181e;
  --plate: rgba(28, 31, 39, 0.55);
  --plate-solid: #1c1f27;
  --plate-shadow: rgba(0, 0, 0, 0.5);
  --glass-border: rgba(255, 255, 255, 0.08);
  --el: rgba(32, 35, 43, 0.95);
  --el-solid: #20232b;
  --well: rgba(25, 27, 34, 0.92);
  --sh-d: rgba(0, 0, 0, 0.55);
  --sh-l: rgba(255, 255, 255, 0.05);
  --hairline: rgba(255, 255, 255, 0.06);
  --text: #f5f6f8;
  --muted: #a7adba;
  --accent: #8b7cff;
  --accent-btn: #6d5ef0;
  --accent-hover: #6352e6;
  --on-accent: #ffffff;
  --accent-text: #9b8eff;
  --accent-well: rgba(139, 124, 255, 0.2);
  --accent-sh-d: rgba(0, 0, 0, 0.55);
  --focus: #9b8eff;
  --ok: #4ade80;
  --bad: #f87171;
  --opt: #fbbf24;
  --blob-1: #3b3672;
  --blob-2: #1c4d4f;
  --blob-3: #4e2d4a;
  --blob-4: #253559;
  --blob-o: 0.55;

  --raise: 9px 9px 20px var(--sh-d), -9px -9px 20px var(--sh-l);
  --raise-sm: 5px 5px 12px var(--sh-d), -5px -5px 12px var(--sh-l);
  --raise-xs: 3px 3px 7px var(--sh-d), -3px -3px 7px var(--sh-l);
  --inset: inset 5px 5px 11px var(--sh-d), inset -5px -5px 11px var(--sh-l);
  --inset-sm: inset 3px 3px 7px var(--sh-d), inset -3px -3px 7px var(--sh-l);
  --raise-accent: 5px 5px 12px var(--accent-sh-d), -5px -5px 12px var(--sh-l);
  --inset-accent: inset 3px 3px 8px rgba(18, 10, 60, 0.42), inset -3px -3px 8px rgba(255, 255, 255, 0.16);
}
:root { color-scheme: dark; }
:root[data-theme="light"] {
  color-scheme: light;
  --page: #dde1eb;
  --plate: rgba(234, 237, 245, 0.64);
  --plate-solid: #e9ecf3;
  --plate-shadow: rgba(70, 76, 110, 0.22);
  --glass-border: rgba(255, 255, 255, 0.6);
  --el: rgba(237, 240, 247, 0.92);
  --el-solid: #eef0f7;
  --well: rgba(225, 229, 239, 0.88);
  --sh-d: rgba(136, 145, 178, 0.42);
  --sh-l: rgba(255, 255, 255, 0.92);
  --hairline: rgba(40, 46, 80, 0.08);
  --text: #1c2030;
  --muted: #4b5264;
  --accent: #5f51c6;
  --accent-btn: #5f51c6;
  --accent-hover: #5648bb;
  --on-accent: #ffffff;
  --accent-text: #4a3eae;
  --accent-well: rgba(95, 81, 198, 0.16);
  --accent-sh-d: rgba(60, 45, 150, 0.35);
  --focus: #4a3eae;
  --ok: #17663f;
  --bad: #a3302a;
  --opt: #7a5200;
  --blob-1: #a79ae0;
  --blob-2: #7cc2ba;
  --blob-3: #f2bba3;
  --blob-4: #9db3e3;
  --blob-o: 0.7;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--page); }
body {
  margin: 0; min-height: 100%;
  display: flow-root; /* keeps .app's margin inside body: no 16px page scroll */
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  color: var(--text); background: var(--page);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
b, strong { font-weight: 650; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ---------- background: soft colour blobs behind frosted glass ---------- */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob {
  position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%;
  opacity: var(--blob-o); filter: blur(80px); will-change: transform;
}
.blob-1 { background: var(--blob-1); top: -22vmax; left: -14vmax; animation: drift-a 64s ease-in-out infinite alternate; }
.blob-2 { background: var(--blob-2); bottom: -28vmax; left: 16vw; animation: drift-b 78s ease-in-out infinite alternate; }
.blob-3 { background: var(--blob-3); top: -12vmax; right: -20vmax; width: 50vmax; height: 50vmax; animation: drift-c 70s ease-in-out infinite alternate; }
.blob-4 { background: var(--blob-4); bottom: -18vmax; right: -12vmax; width: 44vmax; height: 44vmax; animation: drift-a 90s ease-in-out infinite alternate-reverse; }
@keyframes drift-a { to { transform: translate3d(6vmax, 5vmax, 0); } }
@keyframes drift-b { to { transform: translate3d(-7vmax, -4vmax, 0); } }
@keyframes drift-c { to { transform: translate3d(-5vmax, 6vmax, 0); } }

/* ---------- the glass plate ---------- */
.app {
  position: relative; z-index: 1;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  width: min(1088px, calc(100% - 32px));
  height: calc(100vh - 32px);
  margin: 16px auto;
  border-radius: 28px;
  background: var(--plate);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  backdrop-filter: blur(28px) saturate(150%);
  box-shadow: 0 30px 70px -30px var(--plate-shadow);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .app { background: var(--plate-solid); }
}

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; padding: 18px 24px 12px; }
.brand { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; }
.mark {
  flex: none; width: 42px; height: 42px; border-radius: 14px;
  display: grid; place-items: center;
  background: var(--el); box-shadow: var(--raise-sm); color: var(--accent-text);
}
.mark svg { width: 24px; height: 24px; display: block; }
.brand-text { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
.brand-name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
.brand-sub { font-size: 15px; font-weight: 500; color: var(--muted); }
.tag {
  display: inline-flex; align-items: center; height: 24px; padding: 0 10px;
  border-radius: 999px; background: var(--well); box-shadow: var(--inset-sm);
  font-size: 12px; font-weight: 600; color: var(--muted);
}
.tag.mono { font-family: var(--mono); font-weight: 500; }
.tag-demo { color: var(--opt); }
.top-actions { display: flex; align-items: center; gap: 14px; }
.seg { display: inline-flex; gap: 8px; }
.seg button {
  min-width: 52px; height: 36px; padding: 0 12px;
  border: 0; border-radius: 12px; cursor: pointer;
  background: var(--el); box-shadow: var(--raise-xs);
  font-size: 13px; font-weight: 600; color: var(--muted);
  transition: transform 160ms var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--well); box-shadow: var(--inset-sm); color: var(--accent-text); }
.icon-btn {
  width: 42px; height: 42px; display: grid; place-items: center;
  border: 0; border-radius: 14px; cursor: pointer;
  background: var(--el); box-shadow: var(--raise-sm); color: var(--text);
  font-size: 20px;
  transition: transform 160ms var(--ease);
}

/* ---------- icons ---------- */
.ic { display: inline-flex; flex: none; width: 1em; height: 1em; line-height: 0; }
.ic svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 16px; padding: 4px 18px 0; min-height: 0; }
.rail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

.overall {
  margin: 8px 8px 10px; padding: 14px 16px 16px;
  border-radius: 20px; background: var(--el); box-shadow: var(--raise-sm);
}
.overall-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
.overall-title { font-size: 15px; font-weight: 650; }
.overall-sub { font-size: 12.5px; color: var(--muted); }
.track {
  position: relative; height: 10px; margin-top: 12px;
  border-radius: 999px; background: var(--well); box-shadow: var(--inset-sm); overflow: hidden;
}
.fill {
  position: absolute; inset: 2px; border-radius: 999px; background: var(--accent);
  transform: translateX(calc(-100% - 4px));
  transition: transform 240ms var(--ease);
}
.overall-count { margin-top: 9px; font-size: 13px; color: var(--muted); }

.steps {
  position: relative; list-style: none; margin: 0; padding: 8px 8px 16px;
  display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto; min-height: 0;
}
.rail-item {
  position: relative;
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 9px 12px 9px 10px;
  border: 0; border-radius: 16px; cursor: pointer; text-align: left;
  background: var(--el); box-shadow: var(--raise-xs);
  transition: transform 160ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.rail-item[aria-current="step"] { background: var(--well); box-shadow: var(--inset-sm); }
.rail-icon {
  flex: none; width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: 50%; background: var(--el); box-shadow: var(--raise-xs);
  color: var(--accent-text); font-size: 19px;
}
.rail-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rail-title { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-title .short { display: none; }
.rail-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; line-height: 1.35; }
.rail-sicon { display: inline-flex; font-size: 14px; }

/* ---------- detail card ---------- */
.detail { min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: 8px 8px 0; }
.card {
  position: relative; flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column;
  border-radius: 24px; background: var(--el); box-shadow: var(--raise);
}
.card-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 26px 28px 22px; }
.card-nav {
  flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
  padding: 14px 22px 18px; border-top: 1px solid var(--hairline);
}
.card-nav .spacer { flex: 1 1 auto; }
.card-head { display: flex; align-items: flex-start; gap: 16px; }
.head-main { display: flex; align-items: flex-start; gap: 18px; flex: 1 1 auto; min-width: 0; }
.head-pill { flex: none; }
.hero {
  flex: none; width: 64px; height: 64px; display: grid; place-items: center;
  border-radius: 50%; background: var(--el); box-shadow: var(--raise-sm);
  color: var(--accent-text); font-size: 30px;
}
.head-text { min-width: 0; padding-top: 2px; }
.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.card-head h2 { margin-top: 2px; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.012em; border-radius: 6px; }
.why { margin-top: 6px; max-width: 60ch; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 11px;
  border-radius: 999px; background: var(--well); box-shadow: var(--inset-sm);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.pill .ic { font-size: 17px; }
.center-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; min-height: 280px; text-align: center; color: var(--muted);
}
.big-spin { font-size: 36px; color: var(--accent-text); }

.section { margin-top: 22px; }
.label { margin-bottom: 10px; font-size: 12.5px; font-weight: 650; letter-spacing: 0.01em; color: var(--muted); }
.well { padding: 12px 16px; border-radius: 14px; background: var(--well); box-shadow: var(--inset); }
.mono { font-family: var(--mono); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; align-items: baseline; }
.kv .k { font-size: 13px; color: var(--muted); }
.kv .v { font-family: var(--mono); font-size: 13px; color: var(--text); overflow-wrap: anywhere; }

.howto { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.howto > li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; align-items: start; }
.num {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: var(--el); box-shadow: var(--raise-xs);
  font-size: 13px; font-weight: 650; color: var(--accent-text);
}
.howto-text { min-width: 0; padding-top: 4px; }
.inline-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 4px; }
.sub { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.cmd { display: flex; align-items: center; gap: 10px; margin-top: 8px; max-width: 580px; }
.cmd-text {
  flex: 1 1 auto; min-width: 0; display: block; padding: 9px 14px;
  border-radius: 12px; background: var(--well); box-shadow: var(--inset-sm);
  font-family: var(--mono); font-size: 13px; color: var(--text);
  white-space: nowrap; overflow-x: auto;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }

.note, .banner {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: 16px;
  background: var(--well); box-shadow: var(--inset-sm);
  color: var(--accent-text);
}
.note { margin-top: 18px; }
.banner { margin-bottom: 20px; }
.center-state .banner { margin: 0; max-width: 560px; text-align: left; }
.note > .ic, .banner > .ic { font-size: 20px; margin-top: 1px; }
.note-text { flex: 1 1 auto; min-width: 0; color: var(--text); }
.note > .btn, .banner > .btn { flex: none; align-self: center; }
.done-line { display: flex; align-items: center; gap: 10px; margin-top: 20px; color: var(--muted); }
.done-line .ic { font-size: 20px; }

.result {
  display: flex; align-items: flex-start; gap: 12px; margin-top: 20px;
  padding: 12px 16px; border-radius: 14px; background: var(--well); box-shadow: var(--inset-sm);
}
.result > .ic { font-size: 20px; margin-top: 1px; }
.result-text { min-width: 0; color: var(--text); overflow-wrap: anywhere; }
.result-sub { display: block; margin-top: 3px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.elapsed { margin-left: 6px; font-family: var(--mono); font-size: 13px; color: var(--muted); }

.log { margin-top: 12px; }
.log > summary { list-style: none; }
.log > summary::-webkit-details-marker { display: none; }
.log:not([open]) .when-open, .log[open] .when-closed { display: none; }
.log-body { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 12px; }
.log pre {
  margin: 0; width: 100%; max-height: 240px; overflow: auto;
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; line-height: 1.55;
}

.allset {
  display: flex; align-items: center; gap: 18px; margin-top: 22px;
  padding: 18px 20px; border-radius: 20px; background: var(--well); box-shadow: var(--inset);
}
.allset-ic { font-size: 44px; }
.allset-title { margin-bottom: 4px; font-size: 18px; font-weight: 650; }

/* ---------- rows (extras, options) ---------- */
.rows { display: flex; flex-direction: column; gap: 14px; }
.section .rows, .rows:first-child { margin-top: 0; }
[data-region="main"] > .rows { margin-top: 22px; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px 16px;
  padding: 14px 16px; border-radius: 18px; background: var(--el); box-shadow: var(--raise-sm);
}
.row-icon {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  background: var(--well); box-shadow: var(--inset-sm); color: var(--accent-text); font-size: 20px;
}
.row-text { min-width: 0; }
.row-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-weight: 650; }
.row-state { font-size: 12.5px; font-weight: 600; }
.row-sub { font-size: 13.5px; color: var(--muted); }
.row-sub + .cmd { margin-top: 6px; }
.cmd-intro { margin-top: 10px; }
.row-detail { margin-top: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.row-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

.switch {
  flex: none; display: inline-flex; align-items: center; gap: 10px; padding: 4px;
  border: 0; border-radius: 999px; background: transparent; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.switch-track { position: relative; width: 54px; height: 30px; border-radius: 999px; background: var(--well); box-shadow: var(--inset-sm); }
.switch-knob {
  position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--el-solid); box-shadow: var(--raise-xs);
  transition: transform 200ms var(--ease);
}
.switch[aria-checked="true"] .switch-track { background: var(--accent-well); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(24px); background: var(--accent); }
.switch-word { display: inline-flex; align-items: center; min-width: 2.6em; font-size: 13px; font-weight: 600; color: var(--muted); }
.switch-word .ic { font-size: 16px; color: var(--accent-text); }
.switch[aria-checked="true"] .switch-word { color: var(--accent-text); }
.switch[aria-disabled="true"] { cursor: default; }
.switch[aria-disabled="true"] .switch-track { opacity: 0.75; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 9px 16px;
  border: 0; border-radius: 14px; cursor: pointer;
  background: var(--el); box-shadow: var(--raise-sm); color: var(--text);
  font-size: 14px; font-weight: 600; line-height: 1.2; text-decoration: none;
  user-select: none; -webkit-tap-highlight-color: transparent;
  transition: transform 160ms var(--ease);
}
.btn .ic { font-size: 18px; }
.btn.primary { background: var(--accent-btn); color: var(--on-accent); box-shadow: var(--raise-accent); }
.btn.small { min-height: 34px; padding: 6px 12px; border-radius: 12px; font-size: 13px; }
.btn.small .ic { font-size: 16px; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }

/* ---------- footer, toast ---------- */
.foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 12px 26px 16px; font-size: 12px; color: var(--muted); }
.credit { flex: 1 1 260px; min-width: 0; }
.toast {
  position: fixed; left: 50%; bottom: 22px; z-index: 10;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px);
  padding: 11px 16px; border-radius: 14px;
  background: var(--el-solid); box-shadow: var(--raise-sm);
  font-size: 14px; pointer-events: none;
  opacity: 0; transform: translate(-50%, 8px);
  transition: opacity 200ms var(--ease), transform 200ms var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { font-size: 18px; }
.toast > span:last-child { color: var(--text); }

.card-body, .steps, .log pre, .cmd-text {
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent;
}

/* ---------- status colours (after components so they win) ---------- */
.st-ok { color: var(--ok); }
.st-missing { color: var(--bad); }
.st-optional, .st-xmiss { color: var(--opt); }
.st-checking, .st-running { color: var(--accent-text); }
.st-unknown, .st-waiting, .st-todo { color: var(--muted); }

/* ---------- motion ---------- */
@keyframes enter { from { opacity: 0; transform: translateY(6px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.enter { animation: enter 200ms var(--ease) both; }
.intro .overall, .intro .rail-item { animation: rise-in 220ms var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }

@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {

  { id: 'start', icon: 'play', checks: ['Bridge data folder', 'Start script', 'Broker'] },
];
const KNOWN_CHECKS = new Set(STEPS.reduce((all, s) => all.concat(s.checks), []));
const REQUIRED_STEPS = STEPS.filter(s => !s.optional);

  checking: 'ring-resize', running: 'ring-resize', waiting: 'question-circle', todo: 'play',

/* ------------------------------------------------------------------ small helpers */
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function load(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
function save(key, value) { try { window.localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ } }
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
function has(key) { return hasOwn(STRINGS[lang], key) || hasOwn(STRINGS.en, key); }
function raw(key) {
  if (hasOwn(STRINGS[lang], key)) return STRINGS[lang][key];
  if (hasOwn(STRINGS.en, key)) return STRINGS.en[key];
  return key;
}
/** HTML fragment from the table; placeholder values are escaped. */
function T(key, vars) {
  const s = raw(key);
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (hasOwn(vars, k) ? esc(vars[k]) : m)) : s;
}
/** Plain text (tags stripped) for aria labels, titles and announcements. */
function P(key, vars) {
  const s = raw(key).replace(/<[^>]*>/g, '');
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (hasOwn(vars, k) ? String(vars[k]) : m)) : s;
}
function A(key, vars) { return esc(P(key, vars)); }

/* ------------------------------------------------------------------ icons
   ic() writes a placeholder; hydrate() fills it with the SVG. Inserting an SVG starts
   its draw-in animation, so an icon replays whenever it is (re)inserted. Mask ids get a
   unique suffix so two copies of one icon never share a mask. */
function ic(name, cls) {
  return '<span class="ic' + (cls ? ' ' + cls : '') + '" data-ic="' + name + '" aria-hidden="true"></span>';
}
function hydrate(scope) {
  if (!scope) return;
  const list = Array.from(scope.querySelectorAll('[data-ic]'));
  if (scope.matches && scope.matches('[data-ic]')) list.unshift(scope);
  for (const el of list) {
    if (el.firstElementChild) continue;
    const name = el.getAttribute('data-ic');
    const src = ICONS[name];
    if (!src) continue;
    const n = ++iconSeq;
    el.innerHTML = src.replace(/id="([^"]+)"/g, 'id="$1-' + n + '"').replace(/url\(#([^)]+)\)/g, 'url(#$1-' + n + ')');
    const svg = el.firstElementChild;
    if (!svg) continue;
    svg.setAttribute('focusable', 'false');
    if (reducedMQ.matches && name !== 'ring-resize') settle(svg, true);
  }
}
/** Jump an icon to its final frame (and pause it under reduced motion). */
function settle(svg, pause) {
  try {
    if (pause) svg.pauseAnimations();
    svg.setCurrentTime(5);
  } catch (e) { /* no SMIL support */ }
}
function swapIcon(el, name) {
  if (!el) return;
  el.setAttribute('data-ic', name);
  el.textContent = '';
  hydrate(el);
}

/* ------------------------------------------------------------------ checks and status */
function checksByName() {
  const m = Object.create(null);
  const list = state && Array.isArray(state.checks) ? state.checks : [];
  for (const c of list) if (c && typeof c.name === 'string') m[c.name] = c;
  return m;
}
function extraUnknown() {
  const list = state && Array.isArray(state.checks) ? state.checks : [];
  return list.filter(c => c && typeof c.name === 'string' && !KNOWN_CHECKS.has(c.name));
}
const isRequired = c => c.required !== false;
function brokerRunning() {
  if (!state) return false;
  if (typeof state.brokerRunning === 'boolean') return state.brokerRunning;
  const b = checksByName().Broker;
  return !!(b && b.ok);
}
function premiereMin() { return state && state.premiereMin ? String(state.premiereMin) : DEFAULT_PREMIERE_MIN; }
function vars() { return { min: premiereMin() }; }
function stepById(id) { return STEPS.find(s => s.id === id) || null; }
function stepTitle(step, short) { return T(step.id + (short ? '.short' : '.title'), vars()); }
function label(name) { return has('k.' + name) ? T('k.' + name) : esc(name); }

/** ok | missing | optional | todo | unknown | checking | waiting */
function baseStatus(step) {
  if (FILE_MODE) return step.id === 'python' ? 'missing' : 'waiting';
  if (!state) return loadError ? 'unknown' : 'checking';
  const m = checksByName();
  const list = step.checks.map(n => m[n]).filter(Boolean);
  if (step.id === 'extras') list.push(...extraUnknown());
  if (list.some(c => isRequired(c) && !c.ok)) return 'missing';
  if (step.id === 'start') {
    if (!list.length && typeof state.brokerRunning !== 'boolean') return 'unknown';
    return brokerRunning() ? 'ok' : 'todo';
  }
  if (!list.length) return 'unknown';
  if (!step.optional && step.checks.some(n => !m[n])) return 'unknown';
  if (list.some(c => !c.ok)) return 'optional';
  return 'ok';
}
function shownStatus(step) { return running && running.step === step.id ? 'running' : baseStatus(step); }
function readyCount() { return REQUIRED_STEPS.filter(s => baseStatus(s) === 'ok').length; }
function allSet() { return !FILE_MODE && !!state && readyCount() === REQUIRED_STEPS.length; }
function firstSelection() {
  if (FILE_MODE || !state) return 'python';
  const miss = STEPS.find(s => baseStatus(s) === 'missing');
  return miss ? miss.id : 'start';
}
function locked() { return FILE_MODE || !!running || !state || !!state.busy || loadError || connLost; }

/* ------------------------------------------------------------------ card building blocks */
function section(labelKey, inner) {
  return '<section class="section"><h3 class="label">' + T(labelKey) + '</h3>' + inner + '</section>';
}
function foundSection(rows) {
  if (!rows.length) return '';
  return section('detected', '<div class="well kv">' +
    rows.map(r => '<span class="k">' + r.k + '</span><span class="v">' + esc(r.v) + '</span>').join('') + '</div>');
}
function checkRows(names) {
  const m = checksByName();
  return names.map(n => {
    const c = m[n];
    return { k: label(n), v: c ? (c.detail || P(c.ok ? 'found' : 'notFound')) : P('notReported') };
  });
}
function howto(items) {
  return section('howto', '<ol class="howto">' + items.map((h, i) =>
    '<li><span class="num" aria-hidden="true">' + (i + 1) + '</span><div class="howto-text">' + h + '</div></li>').join('') + '</ol>');
}
function note(iconName, html, extra, cls) {
  return '<div class="note' + (cls ? ' ' + cls : '') + '">' + (iconName ? ic(iconName) : '') +
    '<div class="note-text">' + html + '</div>' + (extra || '') + '</div>';
}
function waitingNote() { return note('question-circle', T('waitingNote'), '', 'st-waiting'); }
function doneLine() { return '<p class="done-line">' + ic('confirm', 'st-ok') + '<span>' + T('nothingToDo') + '</span></p>'; }
function cmdBox(cmd, key) {
  return '<div class="cmd"><code class="cmd-text" tabindex="0">' + esc(cmd) + '</code>' +
    '<button type="button" class="btn small" data-copy="' + esc(cmd) + '" data-fk="copy-' + key + '" aria-label="' + A('copyCmd') + '">' +
    ic('clipboard-arrow') + '<span class="copy-label" data-label="copy">' + T('copy') + '</span></button></div>';
}
function actBtn(action, stepId, labelHtml, iconName, opt) {
  opt = opt || {};
  const isRun = !!running && running.name === action;
  const off = locked() || !!opt.disabled;
  return '<button type="button" class="btn' + (opt.primary ? ' primary' : '') + '" data-action="' + action + '" data-step="' + stepId +
    '" data-fk="act-' + action + '"' + (off ? ' aria-disabled="true"' : '') + '>' +
    ic(isRun ? 'ring-resize' : iconName) + '<span>' + (isRun ? T('working') : labelHtml) + '</span></button>';
}
function linkBtn(href, labelHtml, primary, key) {
  return '<a class="btn' + (primary ? ' primary' : '') + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" data-fk="link-' + key + '">' +
    ic('external-link') + '<span>' + labelHtml + '</span></a>';
}
function gotoBtn(stepId) {
  return '<button type="button" class="btn small" data-goto="' + stepId + '" data-fk="goto-' + stepId + '"><span>' + T('goTo') + '</span>' + ic('arrow-right') + '</button>';
}
function actionsRow(btns) {
  const list = btns.filter(Boolean);
  return list.length ? '<div class="actions">' + list.join('') + '</div>' : '';
}

/** The text of an action result, in the current language (plain text). */
function resultMessage(r) {
  if (r.ok) return has('ok.' + r.action) ? P('ok.' + r.action) : (r.message || P('done'));
  if (r.kind === 'busy') return P('busy');
  if (r.kind === 'lost') return P('lost') + ' ' + P('lostHelp');
  if (r.message) return r.message;
  if (r.kind === 'unknown') return P('unknownAction');
  if (r.kind === 'http') return P('httpError', { code: r.code });
  return '';
}
function resultBlock(stepId) {
  if (running && running.step === stepId) {
    return '<div class="result st-running">' + ic('ring-resize') + '<div class="result-text"><b>' +
      (has('run.' + running.name) ? T('run.' + running.name) : T('working')) + '</b><span class="elapsed" data-elapsed></span></div></div>';
  }
  const r = lastRun[stepId];
  if (!r) return '';
  const msg = resultMessage(r);
  let text = r.ok ? '<b>' + esc(msg) + '</b>' : '<b>' + T('failed') + '</b> ' + esc(msg);
  if (r.ok && r.message && r.message !== msg) text += '<span class="result-sub">' + esc(r.message) + '</span>';
  let h = '<div class="result st-' + (r.ok ? 'ok' : 'missing') + '">' + ic(r.ok ? 'confirm-circle' : 'alert-circle') +
    '<div class="result-text">' + text + '</div></div>';
  if (r.output) {
    h += '<details class="log" data-log="' + stepId + '"><summary class="btn small" data-fk="log-' + stepId + '">' + ic('document-list') +
      '<span class="when-closed">' + T('showLog') + '</span><span class="when-open">' + T('hideLog') + '</span></summary>' +
      '<div class="log-body"><pre class="well mono" tabindex="0">' + esc(r.output) + '</pre>' +
      '<button type="button" class="btn small" data-copy-log="' + stepId + '" data-fk="copylog-' + stepId + '">' + ic('clipboard-arrow') +
      '<span class="copy-label" data-label="copyLog">' + T('copyLog') + '</span></button></div></details>';
  }
  return h;
}

function headHtml(step, idx) {
  return '<div class="hero">' + ic(step.icon) + '</div>' +
    '<div class="head-text">' +
    '<p class="eyebrow">' + T('stepOf', { n: idx + 1, m: STEPS.length }) + (step.optional ? ' · ' + T('optionalTag') : '') + '</p>' +

function pillHtml(st) {

function navHtml(step, st, idx) {

function bannerHtml() {

function loadingCard() {

      '<p class="sub">' + T('python.s1b') + '</p>' + cmdBox(PY_WINGET, 'py'),

  ]);

function extraRow(o) {
  const m = checksByName();
  const cs = o.checks.map(n => m[n]);
  const present = cs.filter(Boolean);
  let st;
  if (FILE_MODE) st = 'waiting';
  else if (!state) st = 'checking';
  else if (!present.length) st = 'unknown';
  else if (present.some(c => !c.ok)) st = present.some(c => !c.ok && isRequired(c)) ? 'missing' : 'xmiss';
  else st = present.length === cs.length ? 'ok' : 'unknown';
  const word = st === 'ok' ? T('x.ok') : (st === 'xmiss' || st === 'missing') ? T('x.missing') : T('status.' + st);
  const isRun = !!(running && o.action && running.name === o.action[0]);
  const needs = st !== 'ok';
  let detail = '';
  if (present.length) {
    detail = '<div class="row-detail">' + present.map(c => (o.checks.length > 1 ? esc(c.name) + ': ' : '') + esc(c.detail || P(c.ok ? 'found' : 'notFound'))).join('<br>') + '</div>';
  }
  let extra = '';
  if (needs && o.cmd) extra += '<p class="row-sub cmd-intro">' + o.cmdIntro + '</p>' + cmdBox(o.cmd, o.key);
  if (needs && o.after && !FILE_MODE) extra += '<p class="row-sub cmd-intro">' + o.after + '</p>';
  const act = needs && o.action && !FILE_MODE ? actBtn(o.action[0], 'extras', o.action[1], o.action[2]) : '';
  return '<div class="row">' +
    '<span class="row-icon st-' + st + '">' + ic(isRun ? 'ring-resize' : STATUS_ICON[st]) + '</span>' +
    '<div class="row-text"><div class="row-title"><span>' + esc(o.name) + '</span><span class="row-state st-' + st + '">' + word + '</span></div>' +
    (o.purpose ? '<div class="row-sub">' + o.purpose + '</div>' : '') + detail + extra + '</div>' +
    (act ? '<div class="row-actions">' + act + '</div>' : '') +
    '</div>';
}

function switchRow(key, iconName, title, sub, on, action, related) {
  const busy = !!(running && related.indexOf(running.name) >= 0);
  const off = !action || locked();
  return '<div class="row">' +
    '<span class="row-icon">' + ic(iconName) + '</span>' +
    '<div class="row-text"><div class="row-title" id="sw-' + key + '-t">' + title + '</div><div class="row-sub" id="sw-' + key + '-d">' + sub + '</div></div>' +
    '<button type="button" class="switch" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" aria-labelledby="sw-' + key + '-t" aria-describedby="sw-' + key + '-d"' +
    ' data-fk="sw-' + key + '"' + (action ? ' data-action="' + action + '" data-step="start"' : '') + (off ? ' aria-disabled="true"' : '') + '>' +
    '<span class="switch-track"><span class="switch-knob"></span></span>' +
    '<span class="switch-word">' + (busy ? ic('ring-resize') : T(on ? 'on' : 'off')) + '</span></button>' +
    '</div>';
}
function switchRows() {
  const sc = (state && state.shortcuts) || {};
  const desk = !!sc.desktop;
  const auto = !!sc.autostart;
  return switchRow('desktop', 'monitor-arrow-down', T('start.desk'), T(desk ? 'start.deskHave' : 'start.deskSub'), desk,
      desk ? '' : 'shortcut-desktop', ['shortcut-desktop']) +
    switchRow('autostart', 'sun-rising', T('start.auto'), T('start.autoSub'), auto,
      auto ? 'autostart-off' : 'autostart-on', ['autostart-on', 'autostart-off']);
}

const MAIN = {
  python(step, st) {
    if (FILE_MODE) return note('alert-circle', T('python.missingFile'), '', 'st-missing') + pythonHowto(true);
    const c = checksByName().Python;
    const rows = [{ k: T('python.version'), v: (c && c.detail) || state.python || P('notReported') }];
    if (state.pythonExe) rows.push({ k: T('python.location'), v: state.pythonExe });
    let h = foundSection(rows);
    if (st === 'ok') h += doneLine();
    else if (st === 'missing') h += note('alert-circle', T('python.missingServed'), '', 'st-missing') + pythonHowto(false);

/* ------------------------------------------------------------------ rendering
   The card is split into regions; on a refresh only the regions whose HTML changed are
   replaced, so unchanged icons do not replay. A new step (or language) rebuilds the card
   with the enter animation. */
const REGIONS = ['banner', 'head', 'pill', 'main', 'nav'];

function buildParts() {
  if (!FILE_MODE && !state) {
    return { key: lang + ':' + (loadError ? 'error' : 'loading'), whole: loadError ? errorCard() : loadingCard() };
  }
  const step = stepById(selected) || STEPS[0];
  const st = shownStatus(step);
  const idx = STEPS.indexOf(step);
  return {
    key: lang + ':' + step.id,
    banner: bannerHtml(),
    head: headHtml(step, idx),
    pill: pillHtml(st),
    main: MAIN[step.id](step, st),
    nav: navHtml(step, st, idx),
  };
}
function cardSkeleton(p) {
  if (p.whole != null) return p.whole;
  return '<article class="card" aria-labelledby="card-title"><div class="card-body">' +
    '<div data-region="banner">' + p.banner + '</div>' +
    '<header class="card-head"><div class="head-main" data-region="head">' + p.head + '</div>' +
    '<div class="head-pill" data-region="pill">' + p.pill + '</div></header>' +
    '<div data-region="main">' + p.main + '</div>' +
    '</div><footer class="card-nav" data-region="nav">' + p.nav + '</footer></article>';
}
function applyLogState(scope) {
  scope.querySelectorAll('details[data-log]').forEach(d => { d.open = !!logOpen[d.getAttribute('data-log')]; });
}
function focusHeading() {
  const h = document.getElementById('card-title');
  if (h) h.focus({ preventScroll: true });
}
function renderDetail() {
  const host = $('#detail');
  const parts = buildParts();
  const sameCard = parts.key === cardKey && cardParts && (parts.whole == null) === (cardParts.whole == null);
  if (!sameCard || (parts.whole != null && parts.whole !== cardParts.whole)) {
    host.innerHTML = cardSkeleton(parts);
    hydrate(host);
    applyLogState(host);
    if (!sameCard && host.firstElementChild) host.firstElementChild.classList.add('enter');
    cardKey = parts.key;
    cardParts = parts;
    tickElapsed();
    return;
  }
  if (parts.whole != null) return;
  for (const r of REGIONS) {
    if (parts[r] === cardParts[r]) continue;
    const el = host.querySelector('[data-region="' + r + '"]');
    if (!el) continue;
    const active = document.activeElement;
    const fk = active && el.contains(active) ? active.getAttribute('data-fk') : null;
    el.innerHTML = parts[r];
    hydrate(el);
    applyLogState(el);
    if (fk) {
      const target = el.querySelector('[data-fk="' + fk + '"]');
      if (target) target.focus({ preventScroll: true });
      else focusHeading();
    }
  }
  cardParts = parts;
  tickElapsed();
}

function buildRail(intro) {
  const ol = $('#steps');
  ol.innerHTML = STEPS.map((s, i) =>
    '<li style="--i:' + (i + 1) + '"><button type="button" class="rail-item" data-rail="' + s.id + '" id="rail-' + s.id + '">' +
    '<span class="rail-icon">' + ic(s.icon) + '</span>' +
    '<span class="rail-text"><span class="rail-title"><span class="full"></span><span class="short"></span></span>' +
    '<span class="rail-status"><span class="rail-sicon"></span><span class="rail-word"></span></span></span>' +
    '</button></li>').join('');
  Object.keys(railShown).forEach(k => { delete railShown[k]; });
  hydrate(ol);
  updateRail();
  if (intro) {
    const rail = $('#rail');
    rail.classList.add('intro');
    setTimeout(() => rail.classList.remove('intro'), 1000);
  }
}
function setOnce(el, html) {
  if (el.getAttribute('data-v') === html) return;
  el.innerHTML = html;
  el.setAttribute('data-v', html);
}
function updateRail() {
  for (const s of STEPS) {
    const btn = document.getElementById('rail-' + s.id);
    if (!btn) continue;
    setOnce(btn.querySelector('.full'), stepTitle(s));
    setOnce(btn.querySelector('.short'), stepTitle(s, true));
    const st = shownStatus(s);
    if (railShown[s.id] !== st) {
      railShown[s.id] = st;
      const box = btn.querySelector('.rail-status');
      box.className = 'rail-status st-' + st;
      const si = box.querySelector('.rail-sicon');
      si.innerHTML = ic(STATUS_ICON[st]);
      box.querySelector('.rail-word').innerHTML = T('status.' + st);
      hydrate(si);
    }
    if (s.id === selected) btn.setAttribute('aria-current', 'step');
    else btn.removeAttribute('aria-current');
  }
  const ready = readyCount();
  const total = REQUIRED_STEPS.length;
  const text = allSet() ? P('progressDone') : P('progress', { n: ready, m: total });
  $('#overallCount').textContent = text;
  const bar = $('#progress');
  bar.setAttribute('aria-valuenow', String(ready));
  bar.setAttribute('aria-valuemax', String(total));
  bar.setAttribute('aria-valuetext', text);
  const p = ready / total;
  $('#fill').style.transform = p <= 0 ? 'translateX(calc(-100% - 4px))' : 'translateX(' + ((p - 1) * 100).toFixed(2) + '%)';
}
function renderTop() {
  const v = $('#version');
  const ver = state && state.version ? String(state.version) : '';
  v.hidden = !ver;
  v.textContent = ver ? (/^v/i.test(ver) ? ver : 'v' + ver) : '';
  $('#demoBadge').hidden = !(state && state.demo);
  const fb = $('#folderBtn');
  fb.hidden = FILE_MODE;
  if (state && state.repo) fb.title = String(state.repo);
  if (locked()) fb.setAttribute('aria-disabled', 'true');
  else fb.removeAttribute('aria-disabled');
}
function renderAll() {
  renderTop();
  updateRail();
  renderDetail();
}

/** Keep the selected rail item inside the rail's own scroll area (never scrolls the page). */
function revealRailItem(id) {
  const ol = $('#steps');
  const btn = document.getElementById('rail-' + id);
  if (!ol || !btn) return;
  const li = btn.parentElement;
  const behavior = reducedMQ.matches ? 'auto' : 'smooth';
  if (ol.scrollWidth > ol.clientWidth + 1) {
    if (li.offsetLeft < ol.scrollLeft) ol.scrollTo({ left: li.offsetLeft - 8, behavior });
    else if (li.offsetLeft + li.offsetWidth > ol.scrollLeft + ol.clientWidth) ol.scrollTo({ left: li.offsetLeft + li.offsetWidth - ol.clientWidth + 8, behavior });
  } else if (ol.scrollHeight > ol.clientHeight + 1) {
    if (li.offsetTop < ol.scrollTop) ol.scrollTo({ top: li.offsetTop - 8, behavior });
    else if (li.offsetTop + li.offsetHeight > ol.scrollTop + ol.clientHeight) ol.scrollTo({ top: li.offsetTop + li.offsetHeight - ol.clientHeight + 8, behavior });
  }
}
function select(id, moveFocus) {
  if (!stepById(id)) return;
  const changed = id !== selected;
  selected = id;
  updateRail();
  renderDetail();
  if (changed) {
    const body = $('#detail .card-body');
    if (body) body.scrollTop = 0;
    revealRailItem(id);
  }
  if (moveFocus) {
    focusHeading();
    const detail = $('#detail');
    if (detail.getBoundingClientRect().top < 0) detail.scrollIntoView({ block: 'start', behavior: reducedMQ.matches ? 'auto' : 'smooth' });
  }
}
function go(delta) {
  const i = STEPS.findIndex(s => s.id === selected);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= STEPS.length) return;
  select(STEPS[j].id, true);
}

/* ------------------------------------------------------------------ talking to the setup helper
   Relative URLs only: the page lives at http://127.0.0.1:<port>/<secret>/. Every POST
   carries X-Bridge-Setup: 1 and a JSON object body. No timeout on actions (pip can take
   up to 15 minutes). */
function post(path, body, extra) {
  return fetch(path, Object.assign({ method: 'POST', headers: POST_HEADERS, body: JSON.stringify(body || {}), cache: 'no-store' }, extra || {}));
}

function refreshState(manual) {
  if (FILE_MODE) return Promise.resolve();
  if (inflight) return inflight;
  const t0 = Date.now();
  inflight = fetch('api/state', { cache: 'no-store' })
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(s => {
      if (!s || typeof s !== 'object') throw new Error('bad state');
      state = s;
      loadError = false;
      connLost = false;
      pingFails = 0;
    })
    .catch(() => { loadError = true; })
    .then(() => (manual ? sleep(Math.max(0, 420 - (Date.now() - t0))) : null))
    .then(() => {
      inflight = null;
      lastRefreshAt = Date.now();
      if (state && !selected) selected = firstSelection();
      renderAll();
      scheduleBusyPoll();
    });
  return inflight;
}
function scheduleBusyPoll() {
  clearTimeout(busyTimer);
  if (!FILE_MODE && state && state.busy && !running) busyTimer = setTimeout(() => refreshState(), 2000);
}
function scheduleRecheck() {
  clearTimeout(recheckTimer);
  recheckTimer = setTimeout(() => { if (Date.now() - lastRefreshAt > 1500) refreshState(); }, 350);
}

async function manualRecheck() {
  if (FILE_MODE || checkingManual) return;
  checkingManual = true;
  document.querySelectorAll('[data-recheck]').forEach(b => {
    b.setAttribute('aria-disabled', 'true');
    b.setAttribute('aria-busy', 'true');
    swapIcon(b.querySelector('[data-ic]'), 'ring-resize');
    const l = b.querySelector('.btn-label');
    if (l) l.textContent = P('checking');
  });
  announce(P('checking'));
  await refreshState(true);
  checkingManual = false;
  document.querySelectorAll('[data-recheck][aria-busy="true"]').forEach(b => {
    b.removeAttribute('aria-disabled');
    b.removeAttribute('aria-busy');
    swapIcon(b.querySelector('[data-ic]'), 'rotate-270');
    const l = b.querySelector('.btn-label');
    if (l) l.textContent = P(b.getAttribute('data-label') || 'checkAgain');
  });
  announce(state && !loadError ? P('checked', { n: readyCount(), m: REQUIRED_STEPS.length }) : P('lost'));
}

async function runAction(name, stepId) {
  if (FILE_MODE || running) return;
  if (!state || state.busy) { announce(P('busy')); return; }
  running = { name: name, step: stepId, started: Date.now() };
  if (stepId) delete lastRun[stepId];
  clearTimeout(busyTimer);
  renderAll();
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(tickElapsed, 1000);
  announce(has('run.' + name) ? P('run.' + name) : P('working'));
  const r = { action: name, ok: false, kind: 'fail', message: '', output: '', code: 0 };
  let gotState = false;
  try {
    const res = await post('api/action', { action: name });
    r.code = res.status;
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (data && typeof data.message === 'string') r.message = data.message;
    if (data && data.output != null) r.output = typeof data.output === 'string' ? data.output : JSON.stringify(data.output, null, 2);
    if (res.status === 409) {
      r.kind = 'busy';
      if (data && typeof data.busy === 'string' && !r.message) r.message = data.busy;
    } else if (res.status === 400) r.kind = 'unknown';
    else if (!res.ok || !data) r.kind = 'http';
    else { r.ok = !!data.ok; r.kind = r.ok ? 'ok' : 'fail'; }
    if (data && data.state && typeof data.state === 'object') {
      state = data.state;
      loadError = false;
      connLost = false;
      gotState = true;
    }
  } catch (e) {
    r.kind = 'lost';
  }
  clearInterval(elapsedTimer);
  running = null;
  if (stepId) {
    lastRun[stepId] = r;
    logOpen[stepId] = !r.ok && !!r.output;
  }
  renderAll();
  const msg = resultMessage(r);
  if (stepId) announce(r.ok ? msg : P('failed') + ' ' + msg);
  else toast(msg, r.ok);
  if (!gotState) refreshState();
  if (name === 'start-bridge' && r.ok) {
    setTimeout(() => refreshState(), 1500);
    setTimeout(() => refreshState(), 4000);
  }
  scheduleBusyPoll();
}

function heartbeat() {
  post('api/ping', {})
    .then(res => res.ok, () => false)
    .then(ok => {
      if (ok) {
        pingFails = 0;
        if (connLost) { connLost = false; refreshState(); }
      } else if (++pingFails >= 2 && !connLost) {
        connLost = true;
        renderAll();
      }
    });
}
function sayBye() {
  try { post('api/bye', {}, { keepalive: true }).catch(() => {}); } catch (e) { /* page is going away */ }
}
function tickElapsed() {
  if (!running) return;
  const s = Math.max(0, Math.floor((Date.now() - running.started) / 1000));
  const txt = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = txt; });
}

/* ------------------------------------------------------------------ feedback */
function announce(msg) {
  const el = $('#sr');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 40);
}
function toast(msg, ok) {
  const el = $('#toast');
  el.className = 'toast st-' + (ok ? 'ok' : 'missing');
  el.innerHTML = ic(ok ? 'confirm-circle' : 'alert-circle') + '<span>' + esc(msg) + '</span>';
  hydrate(el);
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
}
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall back below */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}
async function doCopy(btn, text) {
  const ok = await copyText(text);
  const icon = btn.querySelector('[data-ic]');
  const lbl = btn.querySelector('.copy-label');
  swapIcon(icon, ok ? 'clipboard-check' : 'clipboard-arrow');
  if (lbl) lbl.textContent = P(ok ? 'copied' : lbl.getAttribute('data-label') || 'copy');
  announce(P(ok ? 'copied' : 'copyFailed'));
  clearTimeout(btn._copyTimer);
  btn._copyTimer = setTimeout(() => {
    if (!btn.isConnected) return;
    swapIcon(icon, 'clipboard-arrow');
    if (lbl) lbl.textContent = P(lbl.getAttribute('data-label') || 'copy');
  }, 2200);
}

/* ------------------------------------------------------------------ theme (dark by default) and language */
function effectiveTheme() { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function applyThemeAttr(t) {
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  else root.removeAttribute('data-theme');
}
function updateThemeLabel() {
  const btn = $('#themeBtn');
  const label = P(effectiveTheme() === 'dark' ? 'theme.toLight' : 'theme.toDark');
  btn.setAttribute('aria-label', label);
  btn.title = label;
}
function updateThemeIcon(animate) {
  const btn = $('#themeBtn');
  // The icon shows the current theme: a moon in dark, a sun in light.
  btn.innerHTML = ic(effectiveTheme() === 'dark' ? 'sunny-to-moon' : 'moon-to-sunny');
  hydrate(btn);
  const svg = btn.querySelector('svg');
  if (svg && !animate) settle(svg, false);
  updateThemeLabel();
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  save('ppab.theme', next);
  applyThemeAttr(next);
  updateThemeIcon(true);
}
function pickLang() {
  const saved = load('ppab.lang');
  if (saved === 'en' || saved === 'zh') return saved;
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  return /^zh/i.test(nav) ? 'zh' : 'en';
}
function applyLang() {
  root.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = P('docTitle');
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-t-label]').forEach(el => { el.setAttribute('aria-label', P(el.getAttribute('data-t-label'))); });
  document.querySelectorAll('[data-lang]').forEach(b => { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  $('#demoBadge').title = P('demoTitle');
  updateThemeLabel();
}
function setLang(next) {
  if ((next !== 'en' && next !== 'zh') || next === lang) return;
  lang = next;
  save('ppab.lang', next);
  applyLang();
  buildRail(false);
  renderAll();
}

/* ------------------------------------------------------------------ events */
function onClick(e) {
  const el = e.target.closest('button, a');
  if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
  const d = el.dataset;
  if (d.action) runAction(d.action, d.step || '');
  else if (d.rail) select(d.rail, false);
  else if (d.nav) go(Number(d.nav));
  else if ('recheck' in d) manualRecheck();
  else if ('copy' in d) doCopy(el, d.copy);
  else if (d.copyLog) { const r = lastRun[d.copyLog]; if (r && r.output) doCopy(el, r.output); }
  else if (d.goto) select(d.goto, true);
  else if (d.lang) setLang(d.lang);
  else if (el.id === 'themeBtn') toggleTheme();
}
function onRailKey(e) {
  const btns = Array.from(document.querySelectorAll('.rail-item'));
  const i = btns.indexOf(document.activeElement);
  if (i < 0) return;
  const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
  let j;
  if (hasOwn(step, e.key)) j = Math.max(0, Math.min(btns.length - 1, i + step[e.key]));
  else if (e.key === 'Home') j = 0;
  else if (e.key === 'End') j = btns.length - 1;
  else return;
  e.preventDefault();
  btns[j].focus();
}
function bind() {
  document.addEventListener('click', onClick);
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.matches && d.matches('details[data-log]')) logOpen[d.getAttribute('data-log')] = d.open;
  }, true);
  $('#steps').addEventListener('keydown', onRailKey);
  if (!FILE_MODE) {
    // Coming back from Creative Cloud or UXP Developer Tool: check again.
    window.addEventListener('focus', scheduleRecheck);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRecheck(); });
    window.addEventListener('pagehide', sayBye);
    setInterval(heartbeat, 15000);
  }
}

/* ------------------------------------------------------------------ start */
function init() {
  lang = pickLang();
  applyThemeAttr(load('ppab.theme'));
  applyLang();
  updateThemeIcon(false);
  hydrate($('.foot'));
  if (FILE_MODE) {
    selected = 'python';
    root.classList.add('is-file');
  }
  buildRail(true);
  renderAll();
  bind();
  if (!FILE_MODE) refreshState().then(heartbeat);
}
init();
})();
