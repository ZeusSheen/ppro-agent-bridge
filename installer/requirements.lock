# Python packages the installer bundles into its own Python, pinned by version and SHA-256. Read by
# scripts/build_installer.py, which runs pip with --require-hashes --only-binary :all: --platform win_amd64
# --python-version 3.14 --implementation cp --abi cp314 (python.lock.json says which). Wheels are downloaded only
# with --download; every wheel in the build cache is checked against these hashes before pip runs, and pip checks
# them again.
#
# "# group: NAME" starts a group. core is always bundled: websockets (broker, CLI) and pip (the setup window's
# Install Pillow / faster-whisper buttons run `python -m pip`). mcp is bundled with --with-mcp: the MCP Python SDK
# that `python -m ppro_bridge.mcp` needs. Each group lists its whole dependency closure for CPython 3.14 on Windows
# (environment markers evaluated), so pip has nothing left to resolve; a group must not repeat another's package.
#
# Versions: the ones installed and tested on the maintainer's machine on 2026-11-06 (websockets 16.1, mcp 2.3.0,
# Python 3.12). Hashes: computed that day from those wheels in the machine's pip cache, the bytes pip had downloaded
# from PyPI and checked against PyPI's published hashes. The same day the bundle moved to CPython 3.14 (DOC-3) and
# pip to 26.3 (DOC-4: 25.3 has advisories fixed in 26.x): the five binary wheels' cp314 builds and pip 26.3 took the
# SHA-256 PyPI's JSON API publishes for those files (/pypi/<name>/<version>/json); the pure-Python wheels are the
# same files as before. Tested on 3.14 by the release workflow (.github/workflows/release.yml, "Run the test suite
# under the bundled Python"): the whole suite runs with the staged python\python.exe and these wheels before the
# installer is uploaded or signed (QA-2). To change a pin, take the hash from the file's PyPI page
# ("view hashes") or from `pip download` + `pip hash` on a trusted machine, never from a mirror, and keep each
# package's wheel file name in the comment under it.

